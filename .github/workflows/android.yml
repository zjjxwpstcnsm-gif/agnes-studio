name: Android CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint, recovery tests and APK
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Verify APK identity and signature
        run: |
          apk_path=app/build/outputs/apk/debug/app-debug.apk
          build_tools_path="$ANDROID_HOME/build-tools/35.0.0"
          "$build_tools_path/apksigner" verify --verbose --print-certs "$apk_path" | tee app/build/outputs/apk/debug/APK-signature.txt
          "$build_tools_path/aapt" dump badging "$apk_path" | head -n 1 > app/build/outputs/apk/debug/APK-version.txt
          sha256sum "$apk_path" > app/build/outputs/apk/debug/APK-SHA256.txt
      - name: Keep verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AgnesStudio-verification
          path: |
            app/build/reports/
            app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: AgnesStudio-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/APK-*.txt
          if-no-files-found: error
